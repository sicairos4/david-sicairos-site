plugins { id 'com.android.application' }
android {
    namespace 'com.sicairos.workstation'
    compileSdk 35
    defaultConfig {
        applicationId 'com.sicairos.workstation'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.2.0'
    }
    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
