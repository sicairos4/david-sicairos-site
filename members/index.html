<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>209 Media — Sign In</title><meta name="description" content="Sign in to your 209 Media member dashboard."><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font:17px system-ui;background:#f2f6f3;color:#183e30;margin:0;padding:24px}main{max-width:420px;margin:5vh auto;background:white;padding:24px;border-radius:16px}input,button{font:inherit;box-sizing:border-box;width:100%;padding:12px;margin:8px 0}button{background:#175c42;color:white;border:0;border-radius:8px;cursor:pointer}a{color:#175c42}#message{min-height:48px}</style></head><body><main><h1>209 Media</h1><p>Your member dashboard: morning system, focus blocks, goals, and notes.</p><form id="authForm"><label>Email<input id="email" type="email" autocomplete="username" required></label><label>Password<input id="password" type="password" autocomplete="current-password" required minlength="8"></label><button id="submitButton">Sign in</button></form><button id="google">Continue with Google</button><button id="toggle" type="button">New here? Create an account</button><p id="message" role="status" aria-live="polite"></p><a href="../index.html">Back to the website</a></main><script>
const sb=supabase.createClient('https://uwidjnnhdgtrpsymuhwp.supabase.co','sb_publishable_4p80QT7444VeKUlp4ncNvg_OFa9ptaN');
const el=id=>document.getElementById(id),destination=new URL('../dashboard.html',location.href).href;let signup=false,busy=false;
function setBusy(value){busy=value;document.querySelectorAll('button').forEach(b=>b.disabled=value)}
sb.auth.getSession().then(({data,error})=>{if(error)el('message').textContent='Unable to check your session. Please sign in again.';else if(data.session)location.replace(destination)});
el('toggle').onclick=()=>{signup=!signup;el('submitButton').textContent=signup?'Create account':'Sign in';el('toggle').textContent=signup?'Already registered? Sign in':'New here? Create an account';el('password').autocomplete=signup?'new-password':'current-password';el('message').textContent=''};
el('authForm').onsubmit=async e=>{e.preventDefault();if(busy)return;setBusy(true);try{const credentials={email:el('email').value.trim(),password:el('password').value};const result=signup?await sb.auth.signUp({...credentials,options:{emailRedirectTo:destination}}):await sb.auth.signInWithPassword(credentials);if(result.error)throw result.error;el('password').value='';if(result.data.session)location.replace(destination);else el('message').textContent='Check your email for a confirmation link, then sign in.'}catch(error){el('message').textContent=error.message||'Sign-in failed.'}finally{setBusy(false)}};
el('google').onclick=async()=>{if(busy)return;setBusy(true);try{const {error}=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:destination}});if(error)throw error}catch(error){el('message').textContent=error.message||'Google sign-in failed.';setBusy(false)}};
</script></body></html>
