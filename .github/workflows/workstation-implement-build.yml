name: Implement Workstation and build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/implement-workstation.py'
      - '.github/workflows/workstation-implement-build.yml'
permissions:
  contents: write
  pages: write
concurrency:
  group: workstation-implementation
  cancel-in-progress: false
jobs:
  implement-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Apply app implementation
        run: python3 scripts/implement-workstation.py
      - name: Commit implemented app source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/connect-app.js assets/workstation-free-time.js assets/workstation/record-scheduler.js assets/workstation/morning-ui.js assets/workstation/planner-ui.js members/app.html
          git commit -m 'feat(workstation): wire record scheduler, sleep, undo and persisted atomic morning'
          git push origin HEAD:main
      - name: Request website rebuild
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST repos/${{ github.repository }}/pages/builds
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile APK without tests or lint
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: 209-workstation-implemented-debug-${{ github.run_id }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
