name: Operations Drive ledger
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Stage only, or approved conditional in-place update
        type: choice
        options: [stage, apply]
        default: stage
permissions:
  contents: read
concurrency:
  group: operations-drive-ledger-single-writer
  cancel-in-progress: false
jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'requests>=2.32,<3' 'google-auth>=2.38,<3'
      - name: Stage or conditionally update original ledger
        env:
          OPS_LEDGER_API_KEY: ${{ secrets.OPS_LEDGER_API_KEY }}
          OPS_LEDGER_BEARER: ${{ secrets.OPS_LEDGER_BEARER }}
          GDRIVE_LEDGER_OAUTH_JSON: ${{ secrets.GDRIVE_LEDGER_OAUTH_JSON }}
          OPS_DRIVE_CONDITIONAL_WRITE_PROOF: ${{ vars.OPS_DRIVE_CONDITIONAL_WRITE_PROOF }}
          OPS_SYNC_MODE: ${{ inputs.mode }}
          OPS_SYNC_STATE_DIR: ${{ runner.temp }}/operations-ledger-private
        run: python scripts/sync_operations_drive_ledger.py
