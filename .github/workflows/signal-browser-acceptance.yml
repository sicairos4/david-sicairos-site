name: Signal public browser acceptance
on:
  push:
    branches: [main]
    paths: ['.github/workflows/signal-browser-acceptance.yml', 'scripts/signal_browser_acceptance.py']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: signal-public-browser-acceptance
  cancel-in-progress: false
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/signal_browser_acceptance.py
      - name: Retain public audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-browser-audit-${{ github.sha }}
          path: browser-audit-results/
          retention-days: 7
          if-no-files-found: warn
