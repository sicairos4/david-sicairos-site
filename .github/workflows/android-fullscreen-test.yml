name: Android full-screen test APK
on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main]
    paths: ['.github/workflows/android-fullscreen-test.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare isolated package from committed native source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/build.gradle')
          s=p.read_text()
          assert s.count("applicationIdSuffix '.debug'")==1
          assert s.count("versionNameSuffix '-debug'")==1
          p.write_text(s.replace("applicationIdSuffix '.debug'","applicationIdSuffix '.fullscreentest'").replace("versionNameSuffix '-debug'","versionNameSuffix '-fullscreen-test'"))
          p=Path('android/app/src/main/AndroidManifest.xml')
          p.write_text(p.read_text().replace('android:label="209 Workstation"','android:label="209 Full-screen Test"'))
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile committed full-screen source
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug
      - name: Package receipt and checksums
        run: |
          set -euo pipefail
          mkdir -p delivery
          cp android/app/build/outputs/apk/debug/app-debug.apk "delivery/209-workstation-fullscreen-test-${GITHUB_SHA:0:12}.apk"
          cp android/app/src/main/java/com/sicairos/workstation/MainActivity.java delivery/MainActivity.fullscreen-test.java
          cp android/app/build.gradle delivery/build.fullscreen-test.gradle
          cp android/app/src/main/AndroidManifest.xml delivery/AndroidManifest.fullscreen-test.xml
          python3 - <<'PY'
          import json,os,re
          from pathlib import Path
          config=Path('android/app/build.gradle').read_text()
          receipt={'source_sha':os.environ['GITHUB_SHA'],'run_url':os.environ['GITHUB_SERVER_URL']+'/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+os.environ['GITHUB_RUN_ID'],'version_name':re.search(r"versionName\s+'([^']+)'",config).group(1)+'-fullscreen-test','version_code':int(re.search(r'versionCode\s+(\d+)',config).group(1)),'application_id':'com.sicairos.workstation.fullscreentest','variant':'isolated full-screen debug test','production_signed':False,'device_install_verified':False,'google_return_to_app_implemented':False,'live_web_content_pinned':False,'entry_url':'https://209connect.com/members/app.html'}
          Path('delivery/build-receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
          Path('delivery/INSTALL.txt').write_text('Isolated 209 Full-screen Test. Online embedded workspace without Chrome toolbar. Debug signing; upgrades not guaranteed. Google return-to-app is not implemented. Device, print and saved-account acceptance are not verified. Website content is live and not pinned. This workflow does not publish a public release.\n')
          PY
          (cd delivery && sha256sum *.apk *.java *.gradle *.xml build-receipt.json INSTALL.txt > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: 209-workstation-fullscreen-test-${{ github.sha }}-${{ github.run_attempt }}
          path: delivery/
          if-no-files-found: error
          retention-days: 30
