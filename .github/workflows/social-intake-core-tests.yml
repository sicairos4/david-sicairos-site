name: Social intake controller regression
on:
  pull_request:
    paths:
      - 'assets/workstation/social-intake-core.js'
      - 'tests/social-intake-core.test.cjs'
      - '.github/workflows/social-intake-core-tests.yml'
  push:
    branches: ['repair/desk-review-only-20261111']
    paths:
      - 'assets/workstation/social-intake-core.js'
      - 'tests/social-intake-core.test.cjs'
      - '.github/workflows/social-intake-core-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/social-intake-core.test.cjs
