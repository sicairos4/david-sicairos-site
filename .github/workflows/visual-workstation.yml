name: Workstation and Public Files visual audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['assets/workstation/morning.css', 'assets/workstation/responsive-panels.css', 'assets/public-files-panels.css', 'members/app.html', 'public-files.html', 'scripts/audit-styled-workstation.py', '.github/workflows/visual-workstation.yml']
permissions:
  contents: read
jobs:
  visual-local:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/audit-styled-workstation.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: styled-workstation-visual-${{ github.run_id }}
          path: qa-artifacts/styled-workstation/
          if-no-files-found: warn
          retention-days: 14
