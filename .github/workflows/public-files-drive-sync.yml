name: Public Files Drive Sync
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-files-drive-sync
  cancel-in-progress: false
jobs:
  sync:
    if: vars.PUBLIC_FILES_SYNC_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Drive client authentication
        run: python -m pip install 'google-auth>=2,<3' 'requests>=2.32,<3'
      - name: Import Drive catalog as drafts
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.PUBLIC_FILES_GOOGLE_SERVICE_ACCOUNT_JSON }}
          PUBLIC_FILES_DRIVE_FOLDER_ID: ${{ vars.PUBLIC_FILES_DRIVE_FOLDER_ID }}
          SUPABASE_URL: https://uwidjnnhdgtrpsymuhwp.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PUBLIC_FILES_SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/sync_public_files_drive.py
