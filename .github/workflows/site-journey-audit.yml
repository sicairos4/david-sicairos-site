name: Whole-site navigation and newsletter audit
on:
  push:
    branches: [main]
    paths:
      - 'scripts/audit-site-journeys.cjs'
      - '.github/workflows/site-journey-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: whole-site-journey-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Record audited revision
        run: |
          mkdir -p qa-artifacts
          git rev-parse HEAD > qa-artifacts/revision.txt
      - name: Audit every static HTML page and local target
        continue-on-error: true
        run: python scripts/audit-static.py --root . --output qa-artifacts/static-audit.json
      - name: Install isolated browser audit dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/209-site-audit" --no-save --package-lock=false playwright@1.56.1
          "$RUNNER_TEMP/209-site-audit/node_modules/.bin/playwright" install --with-deps chromium
      - name: Inspect rendered pages, newsletter destinations and link responses
        env:
          NODE_PATH: ${{ runner.temp }}/209-site-audit/node_modules
        run: |
          python -m http.server 8765 --bind 127.0.0.1 > "$RUNNER_TEMP/209-site-http.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          sleep 2
          node scripts/audit-site-journeys.cjs
      - name: Retain findings even when an audit step fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-journey-audit-${{ github.run_id }}
          path: qa-artifacts/
          retention-days: 7
