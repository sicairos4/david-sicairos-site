name: Weekly site backup

on:
  schedule:
    - cron: '0 12 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Create dated archive
        run: |
          mkdir -p backup
          tar -czf "backup/site-backup-$(date +%Y-%m-%d).tar.gz" --exclude='.git' --exclude='backup' .
      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-backup-${{ github.run_id }}
          path: backup/
          retention-days: 90
