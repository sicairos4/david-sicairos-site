name: Guest continuation and save regression
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['assets/workstation/guest-continuation*.js', 'assets/workstation/save-safeguards.js', 'tests/guest*.test.cjs', 'tests/save-safeguards.test.cjs', '.github/workflows/guest-save-regression.yml']
  pull_request:
    paths: ['assets/workstation/guest-continuation*.js', 'assets/workstation/save-safeguards.js', 'tests/guest*.test.cjs', 'tests/save-safeguards.test.cjs', '.github/workflows/guest-save-regression.yml']
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check assets/workstation/guest-continuation.js
      - run: node --check assets/workstation/save-safeguards.js
      - run: node --test tests/guest-continuation.test.cjs tests/save-safeguards.test.cjs tests/guest-flow-integration.test.cjs
