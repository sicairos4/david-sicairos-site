name: Movement Strength checks
on:
  push:
    branches: [feature/dbeastco-movement-strength]
  pull_request:
    paths: ['assets/workstation/movement*', 'assets/workstation/compact-pickers.js', 'assets/dbeastco.js', 'routines/**', 'tests/movement*', '.github/workflows/movement-strength.yml']
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check assets/workstation/movement.js && node --test tests/movement-strength.test.cjs
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 4173 > /tmp/movement.log 2>&1 &
          trap 'kill $!' EXIT
          sleep 2
          node tests/movement-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: movement-screenshots
          path: movement-screenshots/
          if-no-files-found: ignore
