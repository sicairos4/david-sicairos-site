name: All-28 cadence watchdog
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: cadence-watchdog
  cancel-in-progress: false
jobs:
  check-cadence:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Evaluate public board without publication authority
        id: evaluate
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime as dt
          import json, math, os, urllib.request
          from pathlib import Path
          cadence = dict(threads=20, bluesky=20, linkedin=20, youtube=35, tiktok=30)
          cadence.update({name: 30 for name in ('ig_personal','ig_hub','ig_davids','ig_atwater','ig_castle','ig_intentionally','ig_elevated','fb_profile','fb_california','fb_dbeastco','fb_elevated','fb_intentionally','fb_problemsolved')})
          now = dt.datetime.now(dt.timezone.utc)
          lines = ['## Cadence observation', 'Observed: ' + now.isoformat()]
          problems = []
          try:
              request = urllib.request.Request('https://209connect.com/209-intelligence/live-state.json', headers={'Cache-Control': 'no-cache'})
              with urllib.request.urlopen(request, timeout=25) as response:
                  raw = response.read(2097153)
              if len(raw) > 2097152:
                  raise ValueError('board_size_limit')
              board = json.loads(raw)
              stamp = board.get('generated_at_iso')
              generated = dt.datetime.fromisoformat(stamp.replace('Z', '+00:00'))
              if generated.tzinfo is None:
                  raise ValueError('timezone_required')
              age = (now - generated).total_seconds()
              lines.append('Board age seconds: %.1f' % age)
              if age < -60 or age > 600:
                  problems.append('Board stale or future-dated; lane state is UNKNOWN, not green.')
              else:
                  lanes = board['system_health']['lanes']
                  for lane, limit in sorted(cadence.items()):
                      item = lanes.get(lane)
                      gap = item.get('gap_min') if isinstance(item, dict) else None
                      if isinstance(gap, bool) or not isinstance(gap, (int, float)) or not math.isfinite(gap) or gap < 0:
                          problems.append(lane + ': missing or invalid gap; UNKNOWN.')
                      elif gap > limit:
                          problems.append('%s: overdue in board snapshot, gap %.1fm, cadence %dm.' % (lane, gap, limit))
          except Exception:
              problems.append('Public board fetch or validation failed; observation unavailable.')
          lines.extend(problems or ['All 18 configured lanes report valid on-cadence gaps in this fresh board snapshot.'])
          lines.append('This is a board observation, not independent platform proof. This workflow never publishes or retries content.')
          body = '\n\n'.join(lines) + '\n'
          Path('watchdog-body.md').write_text(body)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as handle:
              handle.write(body)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as handle:
              handle.write('alert=' + ('true' if problems else 'false') + '\n')
          PY
      - name: Reconcile one watchdog issue
        env:
          ALERT: ${{ steps.evaluate.outputs.alert }}
        shell: bash
        run: |
          set -euo pipefail
          gh label create cadence-watchdog --color D93F0B --description 'Cadence or observation outage' --force
          issue=$(gh issue list --label cadence-watchdog --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ "$ALERT" = true ]; then
            if [ -n "$issue" ]; then
              gh issue edit "$issue" --title '209 cadence: overdue or unknown lanes' --body-file watchdog-body.md
            else
              gh issue create --title '209 cadence: overdue or unknown lanes' --label cadence-watchdog --body-file watchdog-body.md
            fi
          elif [ "$ALERT" = false ] && [ -n "$issue" ]; then
            gh issue edit "$issue" --body-file watchdog-body.md
            gh issue close "$issue" --comment 'Fresh board reports valid on-cadence gaps for all 18 configured lanes. This is not independent platform verification.'
          elif [ "$ALERT" != false ]; then
            echo 'Evaluation did not produce a valid outcome' >&2
            exit 1
          fi
