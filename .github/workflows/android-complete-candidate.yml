name: Complete Workstation candidate
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/android-complete-candidate.yml', '.github/workflows/android-fullscreen-test.yml', 'android/**', 'assets/**', 'members/**', 'tests/**', 'scripts/**', 'supabase/**', '*.html', 'CNAME', 'manifest.json']
permissions:
  contents: read
concurrency:
  group: complete-candidate-${{ github.ref }}
  cancel-in-progress: false
jobs:
  javascript:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: node --check assets/workstation/review-share.js && node --check assets/workstation/journey.js && node --check assets/workstation/day-print.js
      - name: Full JavaScript test directory
        if: ${{ !cancelled() }}
        run: node --test tests/*.test.cjs
      - name: Android download discovery
        if: ${{ !cancelled() }}
        run: node tests/test_android_download.cjs
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Full Python test directory
        run: python -m unittest discover -s tests -p 'test_*.py' -v
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - name: Desktop and mobile planner acceptance
        run: python scripts/test-task-schedule-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: complete-candidate-browser-${{ github.sha }}-${{ github.run_attempt }}
          path: qa-artifacts/task-schedule/
          if-no-files-found: warn
          retention-days: 30
  apk:
    needs: [javascript, python, browser]
    uses: ./.github/workflows/android-fullscreen-test.yml
