name: Task schedule acceptance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'assets/**'
      - 'members/**'
      - 'login.html'
      - 'recover.html'
      - 'tests/**'
      - 'scripts/test-task-schedule-browser.py'
      - '.github/workflows/task-schedule-acceptance.yml'
  pull_request:
    paths:
      - 'assets/**'
      - 'members/**'
      - 'login.html'
      - 'recover.html'
      - 'tests/**'
      - 'scripts/test-task-schedule-browser.py'
      - '.github/workflows/task-schedule-acceptance.yml'
permissions:
  contents: read
concurrency:
  group: task-schedule-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: node --check assets/workstation/review-share.js
      - name: Full Workstation JavaScript regression
        if: ${{ !cancelled() }}
        run: node --test tests/*.test.cjs
      - name: Android download discovery
        if: ${{ !cancelled() }}
        run: node tests/test_android_download.cjs
  delivery-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Full Python test directory
        run: python -m unittest discover -s tests -p 'test_*.py' -v
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - name: Desktop and mobile synthetic planner acceptance
        run: python scripts/test-task-schedule-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: task-schedule-acceptance-${{ github.sha }}-${{ github.run_attempt }}
          path: qa-artifacts/task-schedule/
          if-no-files-found: warn
          retention-days: 14
