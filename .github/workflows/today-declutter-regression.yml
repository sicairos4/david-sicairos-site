name: Today declutter regression
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['assets/workstation/entry-flow.js', 'assets/workstation/simple-day.js', 'tests/today-declutter.test.cjs', '.github/workflows/today-declutter-regression.yml']
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check assets/workstation/entry-flow.js
      - run: node --check assets/workstation/simple-day.js
      - run: node --test tests/today-declutter.test.cjs
