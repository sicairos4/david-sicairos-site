name: Workout flow checks
on:
  push:
    branches: [feature/dbeastco-movement-strength]
  pull_request:
    paths: ['assets/workstation/workout-flow*', 'assets/topbar.js', 'routines/**', 'members/guest.html', 'login.html', 'sovereign-university/**', 'tests/workout-flow*', '.github/workflows/workout-flow.yml']
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check assets/topbar.js && node --check assets/workstation/workout-flow.js && node --test tests/workout-flow.test.cjs
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 4173 > /tmp/workout-flow.log 2>&1 &
          trap 'kill $!' EXIT
          sleep 2
          node tests/workout-flow-browser.cjs
