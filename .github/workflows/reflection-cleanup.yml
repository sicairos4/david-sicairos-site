name: Reflection layout regression
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['assets/workstation/reflection-layout.*', 'assets/workstation/simple-day.js', 'tests/reflection-layout.test.cjs', '.github/workflows/reflection-cleanup.yml']
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check assets/workstation/reflection-layout.js
      - run: node --check assets/workstation/simple-day.js
      - run: node --test tests/reflection-layout.test.cjs
