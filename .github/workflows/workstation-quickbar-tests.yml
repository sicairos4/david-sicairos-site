name: Workstation quick capture tests
on:
  push:
    paths:
      - 'members/app.html'
      - 'assets/workstation-quickbar.*'
      - 'tests/workstation-quickbar.test.cjs'
      - '.github/workflows/workstation-quickbar-tests.yml'
  pull_request:
    paths:
      - 'members/app.html'
      - 'assets/workstation-quickbar.*'
      - 'tests/workstation-quickbar.test.cjs'
      - '.github/workflows/workstation-quickbar-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check assets/workstation-quickbar.js
      - run: node --test tests/workstation-quickbar.test.cjs
