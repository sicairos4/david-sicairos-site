<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>209 Ops — Admin Console</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>body{font-family:Inter,sans-serif;background:#f6f7f9;margin:0;padding:24px}.wrap{max-width:1000px;margin:0 auto}h1{font-size:22px}h2{font-size:15px;margin:20px 0 8px}.panel{background:#fff;border-radius:12px;padding:16px;box-shadow:0 1px 6px rgba(0,0,0,.06);margin-bottom:16px}textarea,input,select{width:100%;padding:10px;border-radius:8px;border:1px solid #d0d5dd;box-sizing:border-box;margin:6px 0;font-family:Inter,sans-serif}button{padding:10px 16px;background:#101828;color:#fff;border:0;border-radius:8px;cursor:pointer;margin:4px 4px 4px 0}.muted{color:#667085;font-size:12px}.ok{color:#1a7f37;font-size:13px}.err{color:#b42318;font-size:13px}</style>
</head>
<body>
<div class="wrap">
<h1>209 Ops — Admin Console</h1>
<p class="muted">Signed in. Edit anything, save live, or type a command for the AI.</p>
<div class="panel"><h2>AI Text Box — Update Anything</h2><textarea id="ai" rows="3" placeholder="e.g. add record: Muse shifted to breaking-news hooks | set hero title: 209 Audit is the engine | set hook: Receipts over narratives."></textarea><button onclick="runAI()">Run Command</button><span id="aiMsg"></span></div>
<div class="panel"><h2>Content Editor — JSON sections</h2><select id="section"><option>records</option><option>featuredStory</option><option>museStatus</option><option>announcements</option><option>whatsWorking</option><option>socialPulse</option><option>podcasts</option></select><textarea id="json" rows="10"></textarea><button onclick="saveSection()">Save Section (Live)</button><span id="secMsg"></span></div>
<div class="panel"><h2>Page Element Editor</h2><select id="page"><option value="index">Homepage</option><option value="muse">Muse</option><option value="intelligence">Intelligence</option></select><input id="elId" placeholder="Element ID (e.g. featuredTitle, featuredHook)"><input id="elText" placeholder="New text"><button onclick="saveElement()">Save Element (Live)</button><span id="elMsg"></span></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const sb=supabase.createClient('https://uwidjnnhdgtrpsymuhwp.supabase.co','sb_publishable_4p80QT7444VeKUlp4ncNvg_OFa9ptaN');
sb.auth.getSession().then(({data})=>{if(!data.session)location.href='index.html'});
const H={'apikey':'sb_publishable_4p80QT7444VeKUlp4ncNvg_OFa9ptaN','Authorization':'Bearer sb_publishable_4p80QT7444VeKUlp4ncNvg_OFa9ptaN','Content-Type':'application/json'};
const SB='https://uwidjnnhdgtrpsymuhwp.supabase.co/rest/v1/site_content';
async function upsert(key,value){
const res=await fetch(SB+'?on_conflict=key',{method:'POST',headers:H,body:JSON.stringify({key,value})});
return res.ok;
}
async function saveSection(){
const k=document.getElementById('section').value;let v;
try{v=JSON.parse(document.getElementById('json').value)}catch(e){document.getElementById('secMsg').textContent='Invalid JSON';return}
const ok=await upsert(k,v);
document.getElementById('secMsg').textContent=ok?'Saved — live immediately.':'Save failed.';
}
async function saveElement(){
const page=document.getElementById('page').value,id=document.getElementById('elId').value,txt=document.getElementById('elText').value;
if(!id||!txt)return;
const existing=await(await fetch(SB+'?key=eq.pageText',H)).json();
let val=(existing[0]&&existing[0].value)||{};
val[page+':'+id]=txt;
const ok=await upsert('pageText',val);
document.getElementById('elMsg').textContent=ok?'Saved — live immediately.':'Save failed.';
}
async function runAI(){
const cmd=document.getElementById('ai').value.trim();if(!cmd)return;
const lower=cmd.toLowerCase();
let ok=false,msg='';
if(lower.startsWith('add record:')){
const headline=cmd.slice(11).trim();
const cur=await(await fetch(SB+'?key=eq.records',H)).json();
const records=(cur[0]&&cur[0].value)||[];
records.unshift({headline:headline,date:new Date().toISOString().slice(0,10),source:'209 Media',link:'209-audit.html'});
ok=await upsert('records',records);msg=ok?'Record added — live.':'Failed.';
}else if(lower.startsWith('set hero title:')){
ok=await upsert('element:featuredTitle',cmd.slice(15).trim());msg=ok?'Hero title updated — live.':'Failed.';
}else if(lower.startsWith('set hook:')){
ok=await upsert('element:featuredHook',cmd.slice(9).trim());msg=ok?'Hook updated — live.':'Failed.';
}else{
ok=await upsert('ai_command',{command:cmd,created:new Date().toISOString()});msg=ok?'Command logged for the next Muse/Gemini cycle.':'Failed.';
}
document.getElementById('aiMsg').textContent=msg;
if(ok)document.getElementById('ai').value='';
}
async function loadSection(){
const k=document.getElementById('section').value;
const cfg=await(await fetch('../data/site-config.json')).json();
const cur=await(await fetch(SB+'?key=eq.'+k,H)).json();
document.getElementById('json').value=JSON.stringify((cur[0]&&cur[0].value)||cfg[k]||[],null,2);
}
document.getElementById('section').addEventListener('change',loadSection);loadSection();
</script>
</body>
</html>
