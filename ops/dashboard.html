<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>209 Ops — AI Command Center</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>body{font-family:Inter,sans-serif;background:#f6f7f9;margin:0;padding:24px}.wrap{max-width:1100px;margin:0 auto}h1{font-size:24px}h2{font-size:16px;margin:24px 0 8px}.panel{background:#fff;border-radius:12px;padding:16px;box-shadow:0 1px 6px rgba(0,0,0,.06);margin-bottom:16px}.item{border-left:3px solid #1a7f37;padding-left:10px;margin-bottom:10px;font-size:14px}.muted{color:#667085;font-size:12px}textarea,input{width:100%;padding:10px;border-radius:8px;border:1px solid #d0d5dd;box-sizing:border-box;margin:6px 0}button{padding:10px 16px;background:#101828;color:#fff;border:0;border-radius:8px;cursor:pointer}.handoff{border:1px solid #e4e7ec;border-radius:8px;padding:10px;margin-bottom:8px;font-size:13px}</style>
</head>
<body>
<div class="wrap">
<h1>209 Ops — AI Command Center</h1>
<p class="muted">Private. Data in use • Live shifts • AI inner workings.</p>
<div class="panel"><h2>Data In Use</h2><div id="dataInUse">Loading…</div></div>
<div class="panel"><h2>Live Shifts</h2><div id="liveShifts">Loading…</div></div>
<div class="panel"><h2>AI Inner Workings</h2><div id="aiInner">Loading…</div></div>
<div class="panel"><h2>One-Prompt Update</h2><textarea id="prompt" rows="3" placeholder="e.g. Add a new record: 'Muse shifted to breaking-news hooks'"></textarea><button onclick="runPrompt()">Run Prompt → Log Handoff</button><div id="promptMsg" class="muted"></div></div>
</div>
<script>
const sb=supabase.createClient('https://uwidjnnhdgtrpsymuhwp.supabase.co','sb_publishable_4p80QT7444VeKUlp4ncNvg_OFa9ptaN');
sb.auth.getSession().then(({data})=>{if(!data.session)location.href='index.html'});
const H={'apikey':'sb_publishable_4p80QT7444VeKUlp4ncNvg_OFa9ptaN','Authorization':'Bearer sb_publishable_4p80QT7444VeKUlp4ncNvg_OFa9ptaN'};
async function loadData(){
const cfg=await(await fetch('../data/site-config.json')).json();
let h='';
(cfg.records||[]).forEach(r=>h+='<div class="item"><strong>'+r.headline+'</strong><br><span class="muted">'+r.date+' • '+r.source+'</span></div>');
(cfg.whatsWorking||[]).forEach(w=>h+='<div class="item"><strong>'+w.metric+'</strong> — '+w.value+' ('+w.trend+')<br>Action: '+w.action+'</div>');
document.getElementById('dataInUse').innerHTML=h;
}
async function loadShifts(){
const a=await(await fetch('https://uwidjnnhdgtrpsymuhwp.supabase.co/rest/v1/adaptation_log?select=*&order=created_at.desc&limit=5',{headers:H})).json();
const t=await(await fetch('https://uwidjnnhdgtrpsymuhwp.supabase.co/rest/v1/top_posts_48h?select=*&order=engagement_delta.desc&limit=5',{headers:H})).json();
let h='';
a.forEach(e=>h+='<div class="item"><strong>'+e.trigger+'</strong><br>'+e.observation+'<br><strong>Decision:</strong> '+e.decision+'<br><strong>Action:</strong> '+e.action+'</div>');
t.forEach(p=>h+='<div class="item"><strong>'+p.title+'</strong> — +'+p.engagement_delta+'%<br><span class="muted">'+p.reason+'</span></div>');
document.getElementById('liveShifts').innerHTML=h||'<p class="muted">No shifts yet.</p>';
}
async function loadHandoffs(){
const rows=await(await fetch('https://uwidjnnhdgtrpsymuhwp.supabase.co/rest/v1/ai_handoffs?select=*&order=created_at.desc&limit=10',{headers:H})).json();
document.getElementById('aiInner').innerHTML=rows.length?rows.map(r=>'<div class="handoff"><strong>'+r.from_ai+' → '+r.to_ai+'</strong><br>Input: '+r.input_summary+'<br>Decision: '+r.decision+'<br>Output: '+r.output_summary+'<br><span class="muted">'+new Date(r.created_at).toLocaleString()+'</span></div>').join(''):'<p class="muted">No AI handoffs logged yet.</p>';
}
async function runPrompt(){
const p=document.getElementById('prompt').value;
if(!p)return;
const{error}=await sb.from('ai_handoffs').insert({cycle_id:Date.now()+'',from_ai:'You',to_ai:'Muse',input_summary:p,decision:'Prompt received — queued for Muse/Gemini cycle',output_summary:'Pending next adaptation cycle'});
document.getElementById('promptMsg').textContent=error?('Error: '+error.message):'Handoff logged. Muse/Gemini will pick it up on the next cycle.';
if(!error){document.getElementById('prompt').value='';loadHandoffs();}
}
loadData();loadShifts();loadHandoffs();
setInterval(loadShifts,60000);setInterval(loadHandoffs,60000);
</script>
</body>
</html>
