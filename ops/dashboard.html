<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>209 Ops — Admin Console</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>body{font-family:Inter,sans-serif;background:#f6f7f9;margin:0;padding:24px}.wrap{max-width:1000px;margin:0 auto}h1{font-size:22px}h2{font-size:15px;margin:20px 0 8px}.panel{background:#fff;border-radius:12px;padding:16px;box-shadow:0 1px 6px rgba(0,0,0,.06);margin-bottom:16px}textarea,input,select{width:100%;padding:10px;border-radius:8px;border:1px solid #d0d5dd;box-sizing:border-box;margin:6px 0;font-family:inherit}button{padding:10px 16px;background:#101828;color:#fff;border:0;border-radius:8px;cursor:pointer;margin:4px 0}.muted{color:#667085;font-size:12px}.ok{color:#1a7f37;font-size:13px}.err{color:#b42318;font-size:13px}</style>
</head>
<body>
<div class="wrap">
<h1>209 Ops — Admin Console</h1>
<p class="muted">Signed in. Edit anything, save, and it goes live instantly.</p>
<div class="panel"><h2>AI Command Box</h2><p class="muted">Type a command like: “add a record: Muse shifted to breaking-news hooks” or “change headline on index.html #featuredTitle to: New headline”.</p><textarea id="cmd" rows="3"></textarea><button onclick="runCmd()">Run Command</button><div id="cmdMsg"></div></div>
<div class="panel"><h2>Content Editor</h2><select id="ckey"><option value="records">records</option><option value="featuredStory">featuredStory</option><option value="museStatus">museStatus</option><option value="announcements">announcements</option><option value="whatsWorking">whatsWorking</option><option value="socialPulse">socialPulse</option><option value="podcasts">podcasts</option></select><textarea id="cval" rows="10"></textarea><button onclick="saveContent()">Save Content</button><div id="cMsg"></div></div>
<div class="panel"><h2>Page Element Editor</h2><select id="epage"><option value="index.html">index.html</option><option value="muse.html">muse.html</option><option value="intelligence/index.html">intelligence/index.html</option><option value="studio.html">studio.html</option></select><input id="esel" placeholder="CSS selector (e.g. #featuredTitle)"><textarea id="etext" rows="3" placeholder="New text"></textarea><button onclick="saveElement()">Save Element</button><div id="eMsg"></div></div>
</div>
<script>
const SB_URL='https://uwidjnnhdgtrpsymuhwp.supabase.co';
const ANON='sb_publishable_4p80QT7444VeKUlp4ncNvg_OFa9ptaN';
const sb=supabase.createClient(SB_URL,ANON);
const H={'apikey':ANON,'Authorization':'Bearer '+ANON,'Content-Type':'application/json'};
sb.auth.getSession().then(({data})=>{if(!data.session)location.href='index.html'});
async function upsert(key,value){
const{error}=await sb.from('site_content').upsert({key,value,updated_at:new Date().toISOString()});
return error;
}
async function saveContent(){
try{
const v=JSON.parse(document.getElementById('cval').value);
const err=await upsert(document.getElementById('ckey').value,v);
document.getElementById('cMsg').textContent=err?('Error: '+err.message):'Saved — live immediately.';
document.getElementById('cMsg').className=err?'err':'ok';
}catch(e){document.getElementById('cMsg').textContent='Invalid JSON.';document.getElementById('cMsg').className='err';}
}
async function saveElement(){
const key='el:'+document.getElementById('epage').value+':'+document.getElementById('esel').value;
const err=await upsert(key,document.getElementById('etext').value);
document.getElementById('eMsg').textContent=err?('Error: '+err.message):'Element saved — live immediately.';
document.getElementById('eMsg').className=err?'err':'ok';
}
async function runCmd(){
const c=document.getElementById('cmd').value.trim();
const msg=document.getElementById('cmdMsg');
if(!c)return;
const m=c.match(/^add a record:\s*(.+)$/i);
if(m){
const err=await upsert('records',{action:'append',headline:m[1],date:new Date().toISOString().slice(0,10),source:'209 Media',link:'209-audit.html'});
msg.textContent=err?('Error: '+err.message):'Record queued — will appear on next page load.';
msg.className=err?'err':'ok';return;
}
const h=c.match(/^change headline on (\S+) (#\S+) to:\s*(.+)$/i);
if(h){
const err=await upsert('el:'+h[1]+':'+h[2],h[3]);
msg.textContent=err?('Error: '+err.message):'Headline changed — live immediately.';
msg.className=err?'err':'ok';return;
}
const s=c.match(/^shift to\s+(.+)$/i);
if(s){
const err=await upsert('museStatus',{state:'Connected',lastRun:new Date().toISOString().slice(0,10),nextAction:'Shift to '+s[1]});
msg.textContent=err?('Error: '+err.message):'Shift logged — Muse will pick it up next cycle.';
msg.className=err?'err':'ok';return;
}
msg.textContent='Command not recognized. Try: “add a record: …”, “change headline on page #id to: …”, or “shift to …”.';
msg.className='err';
}
document.getElementById('ckey').addEventListener('change',async e=>{
const res=await fetch(SB_URL+'/rest/v1/site_content?key=eq.'+e.target.value,{headers:H});
const rows=await res.json();
document.getElementById('cval').value=rows.length?JSON.stringify(rows[0].value,null,2):'{}';
});
</script>
</body>
</html>
