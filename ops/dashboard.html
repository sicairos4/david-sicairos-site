<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>209 Ops — Admin Console</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>body{font-family:Inter,sans-serif;background:#f6f7f9;margin:0;padding:24px}.wrap{max-width:1000px;margin:0 auto}h1{font-size:24px}h2{font-size:16px;margin:20px 0 8px}.panel{background:#fff;border-radius:12px;padding:16px;box-shadow:0 1px 6px rgba(0,0,0,.06);margin-bottom:16px}input,textarea{width:100%;padding:10px;border-radius:8px;border:1px solid #d0d5dd;box-sizing:border-box;margin:6px 0}button{padding:10px 16px;background:#101828;color:#fff;border:0;border-radius:8px;cursor:pointer;margin:4px 0}.muted{color:#667085;font-size:12px}#msg{min-height:18px;font-size:13px}</style>
</head>
<body>
<div class="wrap">
<h1>209 Ops — Admin Console</h1>
<p class="muted">Signed in. Edit anything, save live, or type a command for the AI.</p>
<button onclick="logout()">Sign Out</button>
<div class="panel"><h2>Featured Story (Homepage Hero)</h2><input id="heroTitle" placeholder="Hero title"><input id="heroHook" placeholder="Hero subtitle"><button onclick="saveFeatured()">Save Featured Story</button></div>
<div class="panel"><h2>Add Record</h2><input id="recHeadline" placeholder="Record headline"><input id="recLink" placeholder="Link (e.g. 209-audit.html)"><button onclick="addRecord()">Add Record</button></div>
<div class="panel"><h2>Add Announcement</h2><input id="annTitle" placeholder="Title"><input id="annBody" placeholder="Body"><button onclick="addAnnouncement()">Add Announcement</button></div>
<div class="panel"><h2>Log a Shift</h2><input id="shiftText" placeholder="e.g. Engagement up on Threads — shift to accountability hooks"><button onclick="logShift()">Log Shift</button></div>
<div class="panel"><h2>AI Command Box</h2><textarea id="ai" rows="3" placeholder="Type a command: add record: ... | set hero: ... | add announcement: Title | Body | shift: ..."></textarea><button onclick="runAI()">Run Command</button><div id="msg" class="muted"></div></div>
</div>
<script>
const sb=supabase.createClient('https://uwidjnnhdgtrpsymuhwp.supabase.co','sb_publishable_4p80QT7444VeKUlp4ncNvg_OFa9ptaN');
sb.auth.getSession().then(({data})=>{if(!data.session)location.href='index.html';else load();});
async function upsert(key,value){
const{error}=await sb.from('site_content').upsert({key,value});
document.getElementById('msg').textContent=error?('Error: '+error.message):'Saved live.';
if(!error)load();
}
async function load(){
const{data}=await sb.from('site_content').select('*');
const map={};(data||[]).forEach(r=>map[r.key]=r.value);
const cfg=map.featuredStory||{};
heroTitle.value=cfg.title||'';heroHook.value=cfg.hook||'';
}
async function saveFeatured(){
await upsert('featuredStory',{title:heroTitle.value,hook:heroHook.value,link:'209-audit.html'});
}
async function addRecord(){
const{data}=await sb.from('site_content').select('*').eq('key','records').maybeSingle();
const recs=(data&&data.value)||[];
recs.push({headline:recHeadline.value,date:new Date().toISOString().slice(0,10),source:'209 Media',link:recLink.value||'209-audit.html'});
await upsert('records',recs);recHeadline.value='';recLink.value='';
}
async function addAnnouncement(){
const{data}=await sb.from('site_content').select('*').eq('key','announcements').maybeSingle();
const anns=(data&&data.value)||[];
anns.push({title:annTitle.value,body:annBody.value,link:'muse.html'});
await upsert('announcements',anns);annTitle.value='';annBody.value='';
}
async function logShift(){
await sb.from('adaptation_log').insert({trigger:'Manual shift',observation:shiftText.value,decision:'Apply shift',action:shiftText.value,status:'Applied',platform:'All'});
const{data}=await sb.from('site_content').select('*').eq('key','whatsWorking').maybeSingle();
const w=(data&&data.value)||[];
w.push({metric:'Manual shift',value:shiftText.value,trend:'up',action:shiftText.value});
await upsert('whatsWorking',w);shiftText.value='';
}
async function runAI(){
const p=ai.value.trim();if(!p)return;
const addRec=p.match(/^add record:\s*(.+)/i);
const setHero=p.match(/^set hero:\s*(.+)/i);
const addAnn=p.match(/^add announcement:\s*(.+)/i);
const shift=p.match(/^shift:\s*(.+)/i);
if(addRec){recHeadline.value=addRec[1];recLink.value='209-audit.html';await addRecord();}
else if(setHero){heroTitle.value=setHero[1];await saveFeatured();}
else if(addAnn){const parts=addAnn[1].split('|');annTitle.value=parts[0].trim();annBody.value=(parts[1]||'').trim();await addAnnouncement();}
else if(shift){shiftText.value=shift[1];await logShift();}
else{await sb.from('ai_handoffs').insert({cycle_id:Date.now()+'',from_ai:'You',to_ai:'Muse',input_summary:p,decision:'Queued for next cycle',output_summary:'Pending'});}
ai.value='';
}
async function logout(){await sb.auth.signOut();location.href='index.html';}
</script>
</body>
</html>
